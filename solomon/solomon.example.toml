# Copy to solomon.toml (next to where you run `solomon`) and edit.
# Every key is optional; these are the defaults.

state_dir = ".solomon"          # run logs and worktrees live in <project>/.solomon
# project = "/Users/you/work/my-app"   # default target repository: a LOCAL folder, no GitHub needed
projects_root = "~/Solomon-Projects"   # where the dashboard creates NEW project folders

[roles]                          # who does what. Starting hypothesis, change after your own experiment.
planner  = "claude"
builder  = "codex"
reviewer = "claude"              # must differ from builder unless loop.allow_same_provider = true
# reviewer2 = "antigravity"      # optional second reviewer: it must pass too (never the builder)

[executables]                    # only needed if a CLI is not on PATH
# claude = "/Users/you/.local/bin/claude"
# codex  = "/opt/homebrew/bin/codex"

[extra_args]                     # appended to each CLI call, e.g. to pin a model
# claude = ["--model", "sonnet"]
# codex  = ["--model", "gpt-5"]
# Arguments for Claude's read-only calls (planner, reviewer). Default: no tools and no MCP servers,
# which keeps those calls to one small turn. Set to [] to turn it off. Never use --bare (breaks subscription login).
# claude_readonly = ["--tools", "", "--strict-mcp-config"]
# Arguments added to Claude's WRITE calls (when Claude is the builder). Off by default. To try limiting it to file tools:
# claude_write = ["--tools", "Read,Edit,Write,Glob,Grep", "--strict-mcp-config"]

[ollama]                         # a local model on this computer (free, nothing leaves the machine); read-only helper roles only
url      = "http://127.0.0.1:11434"   # only this computer is allowed
model    = "qwen3:8b"                 # a name from `ollama list`
num_ctx  = 16384                      # prompt window; a prompt that fills it is an error, never a silently cut answer
keep_alive = "30m"

[timeouts]                       # seconds
planner   = 300
builder   = 900
reviewer  = 300
no_output = 180
verify    = 600

[safety]
max_files_changed = 15
max_diff_lines    = 1500
approved_commands = ["python", "python3", "pytest", "npm", "node", "cargo", "go", "make"]

[verification]
test_command = ["python3", "-m", "pytest", "-q"]   # [] = no automatic tests (result is UNVERIFIED)

[loop]
max_attempts        = 3          # 0 = keep trying until it passes (the dashboard's "끈질기게 시도" uses 0 + a 180 minute budget)
max_run_minutes     = 0          # wall-clock budget of one run, 0 = none
max_tokens          = 0          # token budget of one run, 0 = none
stagnation_limit    = 3          # this many identical failures in a row = restart from clean with a different approach
max_restarts        = 2
double_check_tests  = true       # run the tests a second time before declaring a pass
baseline_check      = true       # run the tests on the untouched code first (a broken test setup must not burn tokens)
include_uncommitted = true       # work on the folder as it is on disk, uncommitted edits included (secret files excluded)
on_quota            = "stop"     # "stop" ends the run when a subscription limit is hit; "wait" sleeps and retries
quota_wait_sec      = 900
quota_max_waits     = 8
allow_same_provider = false
