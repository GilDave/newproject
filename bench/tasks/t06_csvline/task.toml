title = "CSV 한 줄 파서"
goal = '''csvline.py에 parse_csv_line(line) 함수를 만든다. CSV 한 줄 문자열을 필드 문자열의 리스트로 나눈다. 규칙: (1) 쉼표로 필드를 구분한다. (2) 필드는 큰따옴표로 감쌀 수 있다. 따옴표 안의 쉼표는 구분자가 아니다. (3) 따옴표 안의 큰따옴표 두 개("")는 큰따옴표 하나가 된다. (4) 빈 필드를 허용한다: 'a,,b'는 ['a', '', 'b'], 끝이 쉼표면 마지막에 빈 필드가 생긴다('a,b,'는 ['a', 'b', '']). 빈 문자열은 ['']를 반환한다. (5) 따옴표 밖의 공백은 그대로 유지하고(자르지 않는다) 따옴표 안의 공백도 유지한다. (6) 큰따옴표는 필드의 첫 글자일 때만 따옴표 필드를 연다. 그 외 위치의 큰따옴표(필드 중간, 공백 뒤)는 ValueError. (7) 닫히지 않은 따옴표, 그리고 닫는 따옴표 뒤에 쉼표나 줄 끝이 아닌 문자가 오는 경우는 ValueError. 테스트도 추가한다.'''
