title = "시맨틱 버전 비교"
goal = '''semver.py에 compare_versions(a, b) 함수를 만든다. 두 버전 문자열을 비교해 a가 작으면 -1, 같으면 0, 크면 1을 반환한다(int). 시맨틱 버저닝 2.0.0의 우선순위 규칙을 따른다. 규칙: (1) 형식은 MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]. MAJOR, MINOR, PATCH는 숫자이고 선행 0은 허용하지 않는다(0 자체는 허용). (2) MAJOR, MINOR, PATCH는 숫자로 비교한다(1.9.0 < 1.10.0). (3) PRERELEASE가 있는 버전은 같은 숫자의 정식 버전보다 낮다. (4) PRERELEASE는 점으로 구분된 식별자로 이루어지며 왼쪽부터 비교한다. 숫자로만 된 식별자끼리는 정수로 비교하고, 문자가 섞인 식별자끼리는 ASCII 순서로 비교하며, 숫자 식별자는 문자 식별자보다 낮다. 앞부분이 모두 같으면 식별자가 더 많은 쪽이 크다. (5) BUILD 메타데이터는 비교에서 무시한다. (6) 식별자는 [0-9A-Za-z-]만 허용하고 비어 있으면 안 된다. 숫자로만 된 PRERELEASE 식별자는 선행 0이 있으면 안 된다. (7) 형식이 잘못된 입력('1.0', '1.0.0.0', '01.0.0', 'v1.0.0', '1.0.0-', '1.0.0-01', '1.0.0-alpha..1', 빈 문자열)은 ValueError. 문자열이 아닌 입력은 TypeError. 테스트도 추가한다.'''
