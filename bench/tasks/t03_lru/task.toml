title = "LRU 캐시"
goal = '''lru.py에 LRUCache 클래스를 만든다. LRUCache(capacity)로 생성한다. 규칙: (1) capacity가 1 미만이거나 정수가 아니면 ValueError. (2) get(key)는 값을 반환하고 그 키를 가장 최근에 사용한 것으로 만든다. 없는 키는 None을 반환한다. (3) put(key, value)는 값을 저장하고 그 키를 가장 최근에 사용한 것으로 만든다. 이미 있는 키면 값만 갱신하고 개수는 늘지 않는다. (4) 용량을 넘으면 가장 오래 사용하지 않은 항목 하나를 제거한다. (5) len(cache)와 `key in cache`가 동작한다. `in` 검사는 사용 순서를 바꾸지 않는다. (6) 값으로 None을 저장할 수 있다. 그 키에 get을 하면 마찬가지로 가장 최근 사용으로 바뀐다(없는 키와는 `in`으로 구분한다). (7) keys()는 가장 오래된 키부터 가장 최근 키 순서의 리스트를 반환한다. 테스트도 추가한다.'''
