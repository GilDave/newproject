title = "구간 병합"
goal = '''intervals.py에 merge_intervals(intervals) 함수를 만든다. 정수 구간 (start, end)의 리스트를 받아 겹치거나 맞닿은 구간을 합쳐 start 오름차순 리스트로 반환한다. 규칙: (1) 구간은 양 끝을 포함한다. (2) start가 이전 구간의 end 이하이면 합친다. 예: (1,3),(3,5)는 (1,5)가 된다. 정수로 인접하기만 한 (1,2),(3,4)는 합치지 않는다. (3) 입력은 정렬되어 있지 않아도 된다. (4) 입력 리스트와 그 안의 값을 변경하지 않는다. (5) 빈 입력은 빈 리스트를 반환한다. (6) start가 end보다 큰 구간이 하나라도 있으면 ValueError를 발생시킨다. 반환값은 튜플의 리스트다. 테스트도 추가한다.'''
