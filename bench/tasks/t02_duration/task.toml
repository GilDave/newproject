title = "기간 문자열 파싱"
goal = '''duration.py에 parse_duration(text) 함수를 만든다. '1h30m', '2d', '45s', '1d 2h 3m 4s' 같은 문자열을 초 단위 int로 변환한다. 규칙: (1) 단위는 d(86400초), h(3600초), m(60초), s(1초) 네 가지다. (2) 숫자는 0 이상의 정수다. (3) 단위는 대소문자를 구분하지 않는다. (4) 숫자와 단위로 이뤄진 토큰 사이의 공백은 허용하고, 문자열 앞뒤 공백은 무시한다. (5) 단위 순서는 자유다('30m1h'도 허용). (6) 같은 단위가 대소문자 무시로 두 번 나오면 ValueError. (7) 숫자만 있고 단위가 없는 경우('90'), 빈 문자열이나 공백뿐인 문자열, 알 수 없는 단위, 음수, 소수('1.5h'), 숫자 없이 단위만 있는 경우('h')는 모두 ValueError. (8) 문자열이 아닌 입력은 TypeError. 테스트도 추가한다.'''
