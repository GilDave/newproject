title = "로마 숫자 변환"
goal = '''roman.py에 to_roman(n)과 from_roman(s) 함수를 만든다. 규칙: (1) to_roman은 1 이상 3999 이하의 정수를 표준 로마 숫자 대문자 문자열로 바꾼다(4는 IV, 9는 IX, 1994는 MCMXCIV). (2) to_roman에 정수가 아닌 값을 주면 TypeError, 범위를 벗어난 정수는 ValueError. (3) from_roman은 표준 표기의 대문자 로마 숫자만 받아 정수로 바꾼다. (4) 표준이 아닌 표기는 ValueError를 발생시킨다. 예: IIII, VX, IC, IIX, MMMM, 빈 문자열, 소문자 iv. (5) 1부터 3999까지 모든 n에 대해 from_roman(to_roman(n)) == n 이어야 한다. 테스트도 추가한다.'''
